; One host and up to NOODLE_MAX_WORKERS identical worker builds.
; Each worker environment compiles the SAME src/main_worker.cpp with its ID.
[platformio]
default_envs = host

[env:host]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_src_filter = -<*> +<main_host.cpp> +<Max30100Raw.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -std=gnu++11
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D NOODLE2_GRAPH_MAX_NODES=16
    -D NOODLE_MAX_WORKERS=9
    -D NOODLE_TRANSPORT_WINDOW=4
    -D NOODLE_TRANSPORT_CRC=0
    -D NOODLE_ESPNOW_PACING_MS=2
    -D NOODLE_MAX_OCCUPANCY=5
    -D NOODLE_HOST_OCCUPANCY=3
    -D NOODLE_RESERVED_WORKERS=1
    -D NOODLE2_DEFAULT_ARENA_PSRAM=1
    -D PPG_SDA_PIN=17
    -D PPG_SCL_PIN=18
    -D PPG_I2C_HZ=400000
    -D PPG_DEBUG_CSV=0
    ; Baseline Red 24mA / IR 24mA (0x77); tutorial Red 27.1mA / IR 50mA = 0x8F
    -D PPG_LED_CONFIG=0x77
    -D USER_SETUP_LOADED=1
    -D USE_FSPI_PORT=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=11
    -D TFT_RST=1
    -D TFT_BL=14
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

[esp8266_common]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 160000000L
build_flags =
    -std=gnu++11
    -D NOODLE2_GRAPH_MAX_NODES=16
    -D NOODLE_MAX_WORKERS=9
    -D NOODLE2_DEFAULT_CONV_TILE=4
    -D NOODLE_TRANSPORT_WINDOW=4
    -D NOODLE_TRANSPORT_CRC=0
    -D NOODLE_ESPNOW_PACING_MS=2
    -D NOODLE_WORKER_ACTIVATION_STATS=0

[env:worker1]
platform = ${esp8266_common.platform}
board = ${esp8266_common.board}
framework = ${esp8266_common.framework}
monitor_speed = ${esp8266_common.monitor_speed}
board_build.f_cpu = ${esp8266_common.board_build.f_cpu}
build_flags = ${esp8266_common.build_flags}
    -D PIPE_WORKER_ID=1
build_src_filter = -<*> +<main_worker.cpp>

[env:worker2]
platform = ${esp8266_common.platform}
board = ${esp8266_common.board}
